name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: |
            .data-downloads
            data
          key: shici-data-${{ hashFiles('data_release.json', 'scripts/build-data.mjs') }}

      - run: pnpm run build:data
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm exec next build
